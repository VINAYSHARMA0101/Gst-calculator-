name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o GSTCalculatorApp.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - run: cd GSTCalculatorApp && gradle assembleDebug --no-daemon
      - run: cp GSTCalculatorApp/app/build/outputs/apk/debug/app-debug.apk GST-Calculator.apk
      - uses: actions/upload-artifact@v4
        with: { name: GST-Calculator-APK, path: GST-Calculator.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GST Calculator APK
          files: GST-Calculator.apk
